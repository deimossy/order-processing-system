syntax = "proto3";

package user.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/deimossy/order-processing-system/api/user/v1;user_v1";

service UserService {
  rpc Register(RegisterRequest) returns (TokenPair);
  rpc Login(LoginRequest) returns (TokenPair);
  rpc Refresh(RefreshRequest) returns (TokenPair);
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);

  rpc GetPaymentProfile(GetProfileRequest) returns (PaymentProfile);
  rpc GetNotificationProfile(GetProfileRequest) returns (NotificationProfile);
}

message RegisterRequest {
  string email = 1 [(validate.rules).string.email = true];
  string password = 2 [(validate.rules).string = {min_len: 5, max_len: 50}];
}

message LoginRequest {
  string email = 1 [(validate.rules).string.email = true];
  string password = 2 [(validate.rules).string.min_len = 1];
}

message RefreshRequest {
  string refresh_token = 1 [(validate.rules).string.min_len = 1];
}

message LogoutRequest {
  string refresh_token = 1 [(validate.rules).string.min_len = 1];
}

message GetProfileRequest {
  string user_id = 1 [(validate.rules).string.min_len = 1];
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_token_expires_at = 3;
  string user_id = 4;
}

message NotificationProfile {
  string user_id = 1;
  string email = 2;
}

message PaymentProfile {
  string user_id = 1;
  string payment_details = 2;
}